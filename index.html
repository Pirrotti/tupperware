<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema de Gestão — Pirrotti & Marques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- ═══════════════════════════════════════════════════════════
     CAMADA DE DADOS — sempre disponível de imediato (localStorage).
     O Firebase é carregado em paralelo e, se disponível, assume
     a persistência sem travar o carregamento do sistema.
     ═══════════════════════════════════════════════════════════ -->
<script>
  window.PM_FIREBASE_READY = false;

  window.PM_DATA = {
    ready: false,
    async loadList(colName) {
      return JSON.parse(localStorage.getItem('pm_' + colName) || '[]');
    },
    async saveList(colName, list) {
      localStorage.setItem('pm_' + colName, JSON.stringify(list));
      return true;
    },
    async deleteItem(colName, id) {
      return true;
    }
  };
</script>

<!-- ═══════════════════════════════════════════════════════════
     🔧 FIREBASE — CONEXÃO OPCIONAL PARA SINCRONIZAR ENTRE DISPOSITIVOS
     ═══════════════════════════════════════════════════════════
     Passo a passo:
     1. Acesse https://console.firebase.google.com
     2. Crie um novo projeto (gratuito)
     3. No menu lateral, clique em "Firestore Database" → Criar banco de dados
        → Escolha "Iniciar no modo de teste" (depois ajustamos as regras)
     4. Vá em ⚙️ Configurações do projeto → Geral → role até "Seus apps"
     5. Clique no ícone </> (Web) para criar um app web
     6. Copie o objeto firebaseConfig gerado e cole substituindo o bloco abaixo
     Enquanto isso não for feito, o sistema funciona normalmente salvando
     os dados apenas neste navegador (não sincroniza entre computadores).
     ═══════════════════════════════════════════════════════════ -->
<script type="module">
  const firebaseConfig = {
    apiKey: "COLE_AQUI_SUA_API_KEY",
    authDomain: "COLE_AQUI.firebaseapp.com",
    projectId: "COLE_AQUI_PROJECT_ID",
    storageBucket: "COLE_AQUI.appspot.com",
    messagingSenderId: "COLE_AQUI",
    appId: "COLE_AQUI"
  };

  if (firebaseConfig.apiKey !== "COLE_AQUI_SUA_API_KEY") {
    try {
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      const { getFirestore, collection, doc, getDocs, setDoc, deleteDoc } =
        await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window.PM_DATA = {
        ready: true,
        async loadList(colName) {
          try {
            const snap = await getDocs(collection(db, colName));
            const arr = [];
            snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
            return arr;
          } catch (e) {
            console.error('Erro ao carregar', colName, e);
            return JSON.parse(localStorage.getItem('pm_' + colName) || '[]');
          }
        },
        async saveList(colName, list) {
          try {
            for (const item of list) await setDoc(doc(db, colName, item.id), item);
            return true;
          } catch (e) {
            console.error('Erro ao salvar', colName, e);
            localStorage.setItem('pm_' + colName, JSON.stringify(list));
            return false;
          }
        },
        async deleteItem(colName, id) {
          try { await deleteDoc(doc(db, colName, id)); return true; }
          catch (e) { console.error(e); return false; }
        }
      };
      window.PM_FIREBASE_READY = true;
    } catch (e) {
      console.warn('Firebase não pôde ser inicializado. Usando armazenamento local.', e);
    }
  }
  window.dispatchEvent(new Event('pm-firebase-ready'));
</script>

<style>
:root{
  --cream:#D9D3C7; --ink:#1A1713; --ink2:#3D3830; --ink3:#7A7268;
  --burg:#6B1A1A; --burg-l:#8B2020; --gold:#9A7B2F; --white:#FFFFFF;
  --line:rgba(26,23,19,.1); --green:#2F7A4F; --green-bg:rgba(47,122,79,.08); --red-bg:rgba(107,26,26,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink)}
input,select,textarea,button{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(26,23,19,.15);border-radius:4px}

/* ── LOGIN ── */
.login-screen{min-height:100vh;background:var(--ink);display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--cream);max-width:400px;width:100%;padding:52px 44px;border:1px solid var(--line)}
.login-logo{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;color:var(--burg);margin-bottom:4px}
.login-sub{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-bottom:40px}
.login-field{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.login-field label{font-size:10px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3)}
.login-field input{background:#fff;border:1px solid var(--line);padding:13px 16px;font-size:15px;outline:none}
.login-field input:focus{border-color:var(--burg)}
.login-btn{width:100%;background:var(--burg);color:#fff;border:none;padding:14px;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.login-btn:hover{background:var(--burg-l)}
.login-err{display:none;color:var(--burg);font-size:12px;margin-top:14px;text-align:center}
.login-err.on{display:block}
.fb-status{margin-top:24px;padding:12px 14px;font-size:11px;text-align:center;border:1px dashed var(--line);color:var(--ink3)}
.fb-status.warn{border-color:rgba(107,26,26,.3);color:var(--burg)}

/* ── LOADING ── */
.loading-screen{min-height:100vh;background:var(--cream);display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:13px}

/* ── SHELL ── */
.shell{min-height:100vh;background:var(--cream);display:flex}
.sidebar{width:240px;background:var(--ink);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:100;padding:32px 0}
.sidebar-logo{padding:0 28px;margin-bottom:44px;position:relative}
.sidebar-logo .name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:300;color:var(--cream)}
.sidebar-logo .name strong{font-weight:600;color:#C9A96E}
.sidebar-logo .sub{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(217,211,199,.35);margin-top:4px}
.sidebar-close{display:none;position:absolute;top:0;right:0;background:none;border:none;color:var(--cream);font-size:22px;cursor:pointer}
.sidebar nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:0 16px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:12px 16px;background:transparent;border:none;border-left:2px solid transparent;border-radius:2px;cursor:pointer;text-align:left;color:rgba(217,211,199,.55);font-size:13px;font-weight:400;transition:all .15s;width:100%}
.nav-btn.active{background:rgba(217,211,199,.08);color:var(--cream);font-weight:500;border-left-color:var(--burg-l)}
.nav-btn svg{flex-shrink:0;opacity:.6}
.nav-btn.active svg{opacity:1;stroke:#C9A96E}
.sidebar-logout{padding:0 16px;margin-top:auto}
.logout-btn{width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px;background:transparent;border:1px solid rgba(217,211,199,.15);color:rgba(217,211,199,.5);font-size:12px;cursor:pointer;border-radius:2px}

.mobile-topbar{display:none;position:fixed;top:0;left:0;right:0;height:56px;background:var(--ink);align-items:center;justify-content:space-between;padding:0 20px;z-index:90}
.mobile-topbar button{background:none;border:none;color:var(--cream);font-size:20px;cursor:pointer}
.mobile-topbar .title{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--cream)}

.main{margin-left:240px;flex:1;min-height:100vh;padding:40px 48px}

@media(max-width:860px){
  .sidebar{display:none}
  .sidebar.open{display:flex;position:fixed;inset:0;z-index:500;width:100%}
  .sidebar.open .sidebar-close{display:block}
  .main{margin-left:0;padding:80px 20px 40px}
  .mobile-topbar{display:flex}
}

/* ── PAGE HEADER ── */
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:36px;flex-wrap:wrap;gap:16px}
.page-eyebrow{font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.page-title{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:300;margin:0}

/* ── BUTTONS ── */
.btn-primary{background:var(--burg);color:#fff;border:none;padding:12px 24px;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-primary:hover{background:var(--burg-l)}
.btn-ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);padding:11px 20px;font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-ghost:hover{border-color:var(--burg);color:var(--burg)}
.btn-link{background:none;border:none;color:var(--burg);font-size:12px;cursor:pointer}
.btn-filter{font-size:11px;font-weight:500;padding:8px 16px;background:#fff;color:var(--ink2);border:1px solid var(--line);cursor:pointer}
.btn-filter.active{background:var(--burg);color:#fff;border-color:var(--burg)}

/* ── CARD ── */
.card{background:#fff;border:1px solid var(--line);padding:24px}
.card-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400;margin:0 0 20px}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px;margin-bottom:36px}
.stat-box{background:#fff;border:1px solid var(--line);padding:22px 24px;text-align:left;cursor:pointer}
.stat-value{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;margin-bottom:4px}
.stat-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}

/* ── FIELD ── */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.field input,.field select,.field textarea{background:var(--cream);border:1px solid var(--line);padding:11px 14px;font-size:14px;outline:none;width:100%}
.field textarea{min-height:70px;resize:vertical}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ── LIST ── */
.list-wrap{display:flex;flex-direction:column;gap:1px;background:var(--line)}
.list-item{background:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.list-item-main{flex:1;min-width:200px}
.list-item-title{font-size:14px;font-weight:500}
.list-item-sub{font-size:12px;color:var(--ink3);margin-top:2px}

/* ── PILL ── */
.pill{font-size:10px;font-weight:500;letter-spacing:.05em;padding:4px 10px;display:inline-block;background:rgba(26,23,19,.06);color:var(--ink2)}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.burg{background:var(--red-bg);color:var(--burg)}

/* ── EMPTY ── */
.empty{text-align:center;padding:60px 20px;color:var(--ink3)}
.empty p{font-size:13px;margin-bottom:16px}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(26,23,19,.55);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.on{display:flex}
.modal-box{background:var(--cream);max-width:460px;width:100%;max-height:88vh;overflow-y:auto;border:1px solid var(--line)}
.modal-box.wide{max-width:640px}
.modal-header{padding:24px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--cream)}
.modal-header h3{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;margin:0}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink3);line-height:1}
.modal-body{padding:28px}

/* ── TABS ── */
.tabs{display:flex;gap:2px;margin-bottom:24px;border-bottom:1px solid var(--line)}
.tab-btn{padding:10px 18px;background:none;border:none;cursor:pointer;font-size:12px;font-weight:500;color:var(--ink3);border-bottom:2px solid transparent}
.tab-btn.active{color:var(--burg);border-bottom-color:var(--burg)}

/* ── OVERDUE ── */
.txt-burg{color:var(--burg)}
.txt-green{color:var(--green)}
.txt-muted{color:var(--ink3)}
</style>
</head>
<body>

<!-- ═══════════════════ LOADING ═══════════════════ -->
<div id="loadingScreen" class="loading-screen">Carregando sistema...</div>

<!-- ═══════════════════ LOGIN ═══════════════════ -->
<div id="loginScreen" class="login-screen" style="display:none">
  <div class="login-box">
    <div class="login-logo">Pirrotti &amp; Marques</div>
    <div class="login-sub">Sistema de Gestão · Acesso Restrito</div>
    <div class="login-field">
      <label>Senha</label>
      <input type="password" id="loginPwd" placeholder="••••••••" onkeydown="if(event.key==='Enter')tryLogin()">
    </div>
    <button class="login-btn" onclick="tryLogin()">Entrar</button>
    <div class="login-err" id="loginErr">Senha incorreta.</div>
    <div class="fb-status" id="fbStatus">Verificando conexão com banco de dados...</div>
  </div>
</div>

<!-- ═══════════════════ APP SHELL ═══════════════════ -->
<div id="appShell" class="shell" style="display:none">

  <div class="mobile-topbar">
    <button onclick="toggleMobileNav(true)">☰</button>
    <div class="title">P&amp;M</div>
    <div style="width:20px"></div>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="name"><strong>Pirrotti</strong> &amp; Marques</div>
      <div class="sub">Sistema de Gestão</div>
      <button class="sidebar-close" onclick="toggleMobileNav(false)">×</button>
    </div>
    <nav id="navButtons"></nav>
    <div class="sidebar-logout">
      <button class="logout-btn" onclick="doLogout()">↩ Sair</button>
    </div>
  </div>

  <div class="main" id="mainContent"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const ADVOGADOS = ['Chiara Marques', 'Alcides Pirrotti'];
const AREAS = ['Guarda / Visitação','Divórcio','Pensão Alimentícia','Alienação Parental','Inventário','Alvará / Regularização','Holding Familiar','Direito Administrativo'];
const STATUS_CASO = ['Ativo','Aguardando documentos','Em análise','Suspenso','Concluído'];
const NAV = [
  { id:'inicio', label:'Início', icon:'home' },
  { id:'whatsapp', label:'WhatsApp', icon:'chat' },
  { id:'clientes', label:'Clientes', icon:'users' },
  { id:'casos', label:'Casos', icon:'folder' },
  { id:'contratos', label:'Contratos', icon:'file' },
  { id:'agenda', label:'Agenda', icon:'calendar' },
  { id:'financeiro', label:'Financeiro', icon:'money' },
];

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let STATE = { clientes:[], casos:[], agenda:[], financeiro:[], leads:[] };
let currentTab = 'inicio';
let currentModal = null;

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const fmtMoney = v => 'R$ ' + (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = iso => { if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const today = () => new Date().toISOString().slice(0,10);
const esc = s => (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ICONS = {
  home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  money: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/>',
  chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  print: '<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
};
function icon(name, size=16, color='currentColor') {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.6">${ICONS[name]||''}</svg>`;
}

// ═══════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════
function tryLogin() {
  const pwd = document.getElementById('loginPwd').value;
  if (pwd === 'pirrotti2026') {
    sessionStorage.setItem('pm_auth', '1');
    document.getElementById('loginScreen').style.display = 'none';
    initApp();
  } else {
    document.getElementById('loginErr').classList.add('on');
  }
}
function doLogout() {
  sessionStorage.removeItem('pm_auth');
  location.reload();
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
async function boot() {
  window.addEventListener('pm-firebase-ready', () => {
    const fb = document.getElementById('fbStatus');
    if (window.PM_FIREBASE_READY) {
      fb.textContent = '✓ Conectado ao banco de dados (sincronização ativa)';
      fb.classList.remove('warn');
    } else {
      fb.textContent = '⚠ Banco de dados não configurado — usando armazenamento local deste navegador';
      fb.classList.add('warn');
    }
  });

  document.getElementById('loadingScreen').style.display = 'none';

  if (sessionStorage.getItem('pm_auth') === '1') {
    await initApp();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
  }
}

async function initApp() {
  document.getElementById('loadingScreen').style.display = 'flex';
  document.getElementById('loadingScreen').textContent = 'Carregando dados...';
  document.getElementById('loadingScreen').style.display = 'flex';

  const [c, k, a, f, l] = await Promise.all([
    window.PM_DATA.loadList('clientes'),
    window.PM_DATA.loadList('casos'),
    window.PM_DATA.loadList('agenda'),
    window.PM_DATA.loadList('financeiro'),
    window.PM_DATA.loadList('leads'),
  ]);
  STATE.clientes = c; STATE.casos = k; STATE.agenda = a; STATE.financeiro = f; STATE.leads = l;

  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'flex';

  renderNav();
  renderTab('inicio');
}

async function persist(colName) {
  await window.PM_DATA.saveList(colName, STATE[colName]);
}

// ═══════════════════════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════════════════════
function renderNav() {
  const nav = document.getElementById('navButtons');
  nav.innerHTML = NAV.map(n => `
    <button class="nav-btn${currentTab===n.id?' active':''}" onclick="switchTab('${n.id}')">
      ${icon(n.icon, 16, currentTab===n.id?'#C9A96E':'rgba(217,211,199,.4)')}
      ${n.label}
    </button>
  `).join('');
}
function switchTab(id) {
  currentTab = id;
  toggleMobileNav(false);
  renderNav();
  renderTab(id);
}
function toggleMobileNav(open) {
  document.getElementById('sidebar').classList.toggle('open', open);
}

// ═══════════════════════════════════════════════════════════
// TAB ROUTER
// ═══════════════════════════════════════════════════════════
function renderTab(id) {
  const main = document.getElementById('mainContent');
  if (id==='inicio') main.innerHTML = viewInicio();
  else if (id==='whatsapp') main.innerHTML = viewWhatsapp();
  else if (id==='clientes') main.innerHTML = viewClientes();
  else if (id==='casos') main.innerHTML = viewCasos();
  else if (id==='contratos') main.innerHTML = viewContratos();
  else if (id==='agenda') main.innerHTML = viewAgenda();
  else if (id==='financeiro') main.innerHTML = viewFinanceiro();
}

// ═══════════════════════════════════════════════════════════
// VIEW: INÍCIO
// ═══════════════════════════════════════════════════════════
function viewInicio() {
  const casosAtivos = STATE.casos.filter(c=>c.status==='Ativo').length;
  const proximosEventos = STATE.agenda.filter(a=>a.data>=today()).sort((a,b)=>a.data.localeCompare(b.data)).slice(0,5);
  const aReceber = STATE.financeiro.filter(f=>f.tipo==='receber'&&f.status!=='pago').reduce((s,f)=>s+Number(f.valor||0),0);
  const aPagar = STATE.financeiro.filter(f=>f.tipo==='pagar'&&f.status!=='pago').reduce((s,f)=>s+Number(f.valor||0),0);
  const atrasados = STATE.financeiro.filter(f=>f.status!=='pago'&&f.vencimento<today());
  const nomeCliente = id => STATE.clientes.find(c=>c.id===id)?.nome || '';

  return `
    <div class="page-header"><div><div class="page-eyebrow">Visão geral</div><h1 class="page-title">Bom dia.</h1></div></div>
    <div class="stats-grid">
      <button class="stat-box" onclick="switchTab('clientes')"><div class="stat-value">${STATE.clientes.length}</div><div class="stat-label">Clientes ativos</div></button>
      <button class="stat-box" onclick="switchTab('casos')"><div class="stat-value">${casosAtivos}</div><div class="stat-label">Casos em andamento</div></button>
      <button class="stat-box" onclick="switchTab('financeiro')"><div class="stat-value txt-green">${fmtMoney(aReceber)}</div><div class="stat-label">A receber</div></button>
      <button class="stat-box" onclick="switchTab('financeiro')"><div class="stat-value txt-burg">${fmtMoney(aPagar)}</div><div class="stat-label">A pagar</div></button>
    </div>
    <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:24px" id="inicioGrid">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
          <h3 class="card-title" style="margin:0">Próximos compromissos</h3>
          <button class="btn-link" onclick="switchTab('agenda')">Ver agenda →</button>
        </div>
        ${proximosEventos.length===0 ? emptyHtml('Nenhum compromisso agendado.') : `
          <div>${proximosEventos.map(e=>`
            <div style="display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center">
              <div style="font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--burg);min-width:66px">${fmtDate(e.data)}</div>
              <div style="flex:1"><div style="font-size:13px;font-weight:500">${esc(e.titulo)}</div><div style="font-size:11px;color:var(--ink3);margin-top:2px">${esc(e.hora||'')} ${e.responsavel?'· '+esc(e.responsavel):''}</div></div>
            </div>`).join('')}</div>
        `}
      </div>
      <div class="card">
        <h3 class="card-title">Financeiro em atraso</h3>
        ${atrasados.length===0 ? emptyHtml('Nenhum pagamento atrasado.') : `
          <div>${atrasados.slice(0,5).map(f=>`
            <div style="padding:12px 0;border-bottom:1px solid var(--line)">
              <div style="display:flex;justify-content:space-between"><span style="font-size:13px">${esc(f.descricao)}</span><span style="font-size:13px;font-weight:500;color:var(--burg)">${fmtMoney(f.valor)}</span></div>
              <div style="font-size:10px;color:var(--ink3);margin-top:2px">Venceu ${fmtDate(f.vencimento)}</div>
            </div>`).join('')}</div>
        `}
      </div>
    </div>
    <style>@media(max-width:860px){#inicioGrid{grid-template-columns:1fr !important}}</style>
  `;
}
function emptyHtml(text, actionHtml='') {
  return `<div class="empty"><p>${text}</p>${actionHtml}</div>`;
}

function dragLead(ev, id) { dragLeadId = id; ev.dataTransfer.effectAllowed = 'move'; }

async function dropLead(ev, novaColuna) {
  ev.preventDefault();
  if (!dragLeadId) return;
  const lead = STATE.leads.find(l => l.id === dragLeadId);
  if (!lead) return;
  const colunaAnterior = lead.coluna;
  lead.coluna = novaColuna;
  await persist('leads');

  // Ao cair em "Contrato Gerado" pela primeira vez: converte automaticamente em Cliente + Caso
  if (novaColuna === 'contrato' && colunaAnterior !== 'contrato' && !lead.convertidoParaCasoId) {
    await converterLeadEmContrato(lead);
  }
  dragLeadId = null;
  renderTab('whatsapp');
}

// ── Conversão automática: Lead → Cliente + Caso, pronto pra gerar contrato ──
async function converterLeadEmContrato(lead) {
  // Verifica se já existe cliente com esse telefone (evita duplicar)
  let cliente = STATE.clientes.find(c => c.telefone && lead.telefone && c.telefone.replace(/\D/g,'') === lead.telefone.replace(/\D/g,''));
  if (!cliente) {
    cliente = { id: uid(), nome: lead.nome, telefone: lead.telefone||'', email:'', cpf:'', endereco:'', obs: lead.mensagem?('Origem: WhatsApp — "'+lead.mensagem+'"'):'Origem: WhatsApp', criadoEm: today() };
    STATE.clientes.push(cliente);
    await persist('clientes');
  }

  const areaResp = lead.advogado || (ADVOGADOS.includes(lead.responsavel) ? lead.responsavel : ADVOGADOS[0]);
  const caso = {
    id: uid(), clienteId: cliente.id,
    titulo: lead.area ? `${lead.area} — ${cliente.nome}` : `Novo caso — ${cliente.nome}`,
    area: lead.area && AREAS.includes(lead.area) ? lead.area : AREAS[0],
    responsavel: areaResp, status: 'Ativo',
    numeroProcesso: '', descricao: lead.mensagem||'', criadoEm: today(),
  };
  STATE.casos.push(caso);
  await persist('casos');

  lead.convertidoParaCasoId = caso.id;
  lead.convertidoParaClienteId = cliente.id;
  await persist('leads');

  alert(`"${lead.nome}" convertido! Cliente e caso criados automaticamente.\n\nAbrindo a aba Contratos para você já gerar o contrato...`);
  switchTab('contratos');
  contratoSelecionado = caso.id;
  contratoAba = 'honorarios';
  renderTab('contratos');
}

function abrirModalLead(id) {
  const l = id ? STATE.leads.find(x=>x.id===id) : { id:uid(), nome:'', telefone:'', mensagem:'', area:'', coluna:'novo', criadoEm:today() };
  currentModal = { type:'lead', data:l };
  const jaConvertido = l.convertidoParaCasoId;
  showModal(`
    <div class="field"><label>Nome do contato</label><input id="mLeadNome" value="${esc(l.nome)}" placeholder="Como a pessoa se identificou"></div>
    <div class="field"><label>Telefone / WhatsApp</label><input id="mLeadTel" value="${esc(l.telefone)}" placeholder="(44) 99999-9999"></div>
    <div class="field"><label>O que a pessoa precisa (mensagem)</label><textarea id="mLeadMsg" placeholder="Cole ou resuma a mensagem recebida">${esc(l.mensagem)}</textarea></div>
    <div class="field"><label>Área provável</label><select id="mLeadArea">
      <option value="">Não identificado ainda</option>
      ${AREAS.map(a=>`<option ${a===l.area?'selected':''}>${a}</option>`).join('')}
    </select></div>
    <div class="field"><label>Etapa do funil</label><select id="mLeadColuna">
      ${KANBAN_COLUNAS.map(c=>`<option value="${c.id}" ${c.id===l.coluna?'selected':''}>${c.label}</option>`).join('')}
    </select></div>
    ${jaConvertido ? `<div style="background:var(--green-bg);border:1px solid rgba(47,122,79,.2);padding:12px 16px;font-size:12px;color:var(--green);margin-bottom:16px">✓ Já convertido em cliente e caso — veja em Contratos.</div>` : ''}
    <div style="display:flex;gap:10px">
      <button class="btn-primary" style="justify-content:center;flex:1" onclick="salvarLead()">Salvar</button>
      ${id ? `<button class="btn-link" onclick='removerLead(${JSON.stringify(l.id)})'>Remover</button>` : ''}
    </div>
  `, id ? 'Editar Contato' : 'Novo Contato do WhatsApp');
}
async function salvarLead() {
  const l = currentModal.data;
  l.nome = document.getElementById('mLeadNome').value.trim();
  l.telefone = document.getElementById('mLeadTel').value.trim();
  l.mensagem = document.getElementById('mLeadMsg').value.trim();
  l.area = document.getElementById('mLeadArea').value;
  const novaColuna = document.getElementById('mLeadColuna').value;
  const colunaAnterior = l.coluna;
  l.coluna = novaColuna;
  if (!l.nome) { alert('Informe o nome do contato.'); return; }
  const idx = STATE.leads.findIndex(x=>x.id===l.id);
  if (idx>=0) STATE.leads[idx] = l; else STATE.leads.push(l);
  await persist('leads');
  closeModal();

  if (novaColuna === 'contrato' && colunaAnterior !== 'contrato' && !l.convertidoParaCasoId) {
    await converterLeadEmContrato(l);
  } else {
    renderTab('whatsapp');
  }
}
async function removerLead(id) {
  if (!confirm('Remover este contato do funil?')) return;
  STATE.leads = STATE.leads.filter(l=>l.id!==id);
  await persist('leads');
  await window.PM_DATA.deleteItem('leads', id);
  closeModal();
  renderTab('whatsapp');
}

let contratoSelecionado = null;
let contratoAba = 'honorarios';
function viewContratos() {
  const nomeCliente = id => STATE.clientes.find(c=>c.id===id)?.nome || '';
  const casosComCliente = STATE.casos.filter(c=>c.clienteId);
  const casoAtivo = contratoSelecionado ? STATE.casos.find(c=>c.id===contratoSelecionado) : null;

async function salvarContrato(casoId) {
  const caso = STATE.casos.find(c=>c.id===casoId);
  const dados = {
    tipoHonorario: document.getElementById('ctTipo')?.value || caso.contrato?.tipoHonorario || 'percentual',
    percentual: document.getElementById('ctPerc')?.value || '',
    valorFixo: document.getElementById('ctFixo')?.value || '',
    valorEstimado: document.getElementById('ctValorEst')?.value || '',
    formaPagamento: document.getElementById('ctForma')?.value || 'À vista',
    observacoes: document.getElementById('ctObs')?.value || '',
    dataAssinatura: document.getElementById('ctData')?.value || today(),
    vencimentoHonorario: document.getElementById('ctVencimento')?.value || today(),
  };
  caso.contrato = dados;
  await persist('casos');
  await sincronizarFinanceiroDoContrato(caso);
  alert('Contrato salvo — lançamento financeiro atualizado automaticamente.');
  renderTab('contratos');
}

// ── Sincroniza o valor de honorários do contrato com o Financeiro ──
async function sincronizarFinanceiroDoContrato(caso) {
  const d = caso.contrato;
  if (!d) return;

  // Determina o valor a lançar: fixo, misto (soma da parte fixa) ou estimado (percentual puro)
  let valor = 0;
  if (d.tipoHonorario === 'fixo') valor = Number(d.valorFixo) || 0;
  else if (d.tipoHonorario === 'misto') valor = Number(d.valorFixo) || 0;
  else valor = Number(d.valorEstimado) || 0; // percentual puro: usa estimativa se informada

  // Procura lançamento financeiro já vinculado a este caso (criado automaticamente)
  let lanc = STATE.financeiro.find(f => f.casoId === caso.id && f.origemContrato);

  if (valor <= 0) {
    // Sem valor definido: remove lançamento automático se existir (evita lixo no financeiro)
    if (lanc) {
      STATE.financeiro = STATE.financeiro.filter(f => f.id !== lanc.id);
      await persist('financeiro');
    }
    return;
  }

  const descricaoBase = `Honorários — ${caso.titulo}`;
  if (lanc) {
    lanc.descricao = descricaoBase;
    lanc.valor = valor;
    lanc.vencimento = d.vencimentoHonorario || lanc.vencimento;
    lanc.clienteId = caso.clienteId;
    lanc.responsavel = caso.responsavel;
  } else {
    lanc = {
      id: uid(), tipo: 'receber', descricao: descricaoBase, valor,
      vencimento: d.vencimentoHonorario || today(), status: 'pendente',
      clienteId: caso.clienteId, responsavel: caso.responsavel,
      casoId: caso.id, origemContrato: true,
    };
    STATE.financeiro.push(lanc);
  }
  await persist('financeiro');
}

  currentModal = { type:'financeiro', data:f };
  showModal(`
    <div class="field"><label>Descrição</label><input id="mFinDesc" value="${esc(f.descricao)}" placeholder="Ex: Honorários — Caso Silva"></div>
    <div class="field-row">
      <div class="field"><label>Valor (R$)</label><input type="number" id="mFinValor" value="${esc(f.valor)}"></div>
      <div class="field"><label>Vencimento</label><input type="date" id="mFinVenc" value="${esc(f.vencimento)}"></div>
    </div>
    <div class="field"><label>Cliente relacionado (opcional)</label><select id="mFinCliente">
      <option value="">Nenhum</option>
      ${STATE.clientes.map(c=>`<option value="${c.id}" ${c.id===f.clienteId?'selected':''}>${esc(c.nome)}</option>`).join('')}
    </select></div>
    <div class="field"><label>Responsável</label><select id="mFinResp">${ADVOGADOS.map(a=>`<option ${a===f.responsavel?'selected':''}>${a}</option>`).join('')}</select></div>
    <button class="btn-primary" style="justify-content:center;width:100%;margin-top:8px" onclick="salvarFinanceiro()">Salvar Lançamento</button>
  `, `${id?'Editar':'Novo'} Lançamento — ${f.tipo==='receber'?'A Receber':'A Pagar'}`);
}
async function salvarFinanceiro() {
  const f = currentModal.data;
  f.descricao = document.getElementById('mFinDesc').value.trim();
  f.valor = document.getElementById('mFinValor').value;
  f.vencimento = document.getElementById('mFinVenc').value;
  f.clienteId = document.getElementById('mFinCliente').value;
  f.responsavel = document.getElementById('mFinResp').value;
  if (!f.descricao || !f.valor) { alert('Preencha descrição e valor.'); return; }
  const idx = STATE.financeiro.findIndex(x=>x.id===f.id);
  if (idx>=0) STATE.financeiro[idx] = f; else STATE.financeiro.push(f);
  await persist('financeiro');
  closeModal();
  renderTab('financeiro');
}
async function marcarPago(id) {
  const f = STATE.financeiro.find(x=>x.id===id);
  f.status = 'pago'; f.pagoEm = today();
  await persist('financeiro');
  renderTab('financeiro');
}
async function removerFinanceiro(id) {
  if (!confirm('Remover este lançamento?')) return;
  STATE.financeiro = STATE.financeiro.filter(f=>f.id!==id);
  await persist('financeiro');
  await window.PM_DATA.deleteItem('financeiro', id);
  renderTab('financeiro');
}

// ═══════════════════════════════════════════════════════════
// MODAL SYSTEM
// ═══════════════════════════════════════════════════════════
function showModal(bodyHtml, title, wide) {
  let overlay = document.getElementById('genericModal');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'genericModal';
    overlay.className = 'modal-overlay';
    overlay.onclick = e => { if (e.target === overlay) closeModal(); };
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = `
    <div class="modal-box${wide?' wide':''}">
      <div class="modal-header"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
      <div class="modal-body">${bodyHtml}</div>
    </div>
  `;
  overlay.classList.add('on');
}
function closeModal() {
  const overlay = document.getElementById('genericModal');
  if (overlay) overlay.classList.remove('on');
  currentModal = null;
}
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

// ═══════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════
boot();
</script>
